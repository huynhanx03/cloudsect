[package]
name = "cloudsect"
version = "0.1.0"
description = "A quiet sect for your coding agents"
authors = ["CloudSect"]
edition = "2021"

[lib]
name = "cloudsect_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
uuid = { version = "1", features = ["v4"] }
